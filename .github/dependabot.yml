# The workflows pin every action by commit; Dependabot proposes new commits when an action has a
# new release (one pull request a week for all of them). A new release waits 7 days first.
# Crate and Docker updates run weekly and wait 3 days before a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /.horizon
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
