name: CI
# The repository is private, so pushes run Linux only (macOS and Windows minutes cost more).
# Run the workflow by hand for all three systems before a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_systems:
        description: Also test on macOS and Windows
        type: boolean
        default: true
jobs:
  horizon-pins:
    name: Horizon image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Horizon pins
        run: python3 .horizon/verify-pins.py
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.all_systems && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test --locked
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: sh -n install.sh && bash -n scripts/sign-macos.sh
