name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so that a new advisory for a locked dependency shows without a push.
  schedule:
    - cron: '17 5 * * 1'
# Read only: no job writes to the repository.
permissions:
  contents: read
jobs:
  horizon-pins:
    name: Horizon image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Horizon pins
        run: python3 .horizon/verify-pins.py
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fixed version from crates.io, built from its own lock file.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Fails on every RustSec advisory for a crate in Cargo.lock.
      - name: Audit Cargo.lock
        run: cargo audit
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test --locked
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: sh -n install.sh && bash -n scripts/sign-macos.sh && sh -n scripts/update-psl.sh
