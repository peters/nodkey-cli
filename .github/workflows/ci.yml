name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  horizon-pins:
    name: Horizon image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Horizon pins
        run: python3 .horizon/verify-pins.py
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test --locked
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: sh -n install.sh && bash -n scripts/sign-macos.sh && sh -n scripts/update-psl.sh
