name: Release
# A tag builds every target and makes a DRAFT release. The macOS binaries are then signed and
# notarized on the Mac (scripts/sign-macos.sh) and the draft is published by hand. See AGENTS.md.
# Run by hand (workflow_dispatch) to build the archives as workflow artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
# Read only by default. The build jobs run the build scripts of every dependency, so they hold no
# token that can write; only attest and release get more, and they run no code from the build.
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust when the image has none
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add the target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p nodkey
      - name: Package
        shell: bash
        run: |
          name="nodkey-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$dir/nodkey.exe' -DestinationPath '$name.zip'"
          else
            tar -C "$dir" -czf "$name.tar.gz" nodkey
          fi
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/nodkey --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodkey-${{ matrix.target }}
          path: nodkey-${{ matrix.target }}.*
  # Build provenance for every archive, so the installers (with the GitHub CLI) and
  # `gh attestation verify` can check that an archive is one this workflow built. The macOS archives
  # are signed and notarized after this (scripts/sign-macos.sh), so the signed files have no
  # attestation of their own; the script checks the attestation before it signs.
  attest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/nodkey-*'
  release:
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum nodkey-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "nodkey $tag" --generate-notes --draft $pre
          fi
