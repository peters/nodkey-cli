[workspace]
resolver = "3"
members = ["nodkey-proto", "nodkey"]
default-members = ["nodkey-proto", "nodkey"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/peters/nodkey-cli"
publish = false

[workspace.dependencies]
nodkey-proto = { path = "nodkey-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
