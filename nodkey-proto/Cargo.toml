[package]
name = "nodkey-proto"
description = "Nodkey agent protocol v1: messages, HPKE sealing, signed relay calls, check number"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
# Both already come with hpke; used directly by dh.rs (HPKE open when X25519 runs in WebCrypto).
hkdf = { version = "0.13", default-features = false }
# Already comes with hkdf; the WebAuthn PRF output is HMAC-SHA256 (prf.rs).
hmac = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false }
getrandom = "0.4"
# ES256 for passkeys: the authenticator data, signatures and keys the phone makes (webauthn.rs).
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
zeroize = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
x25519-dalek = { version = "3.0.0", default-features = false }
