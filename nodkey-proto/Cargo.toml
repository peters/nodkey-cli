[package]
name = "nodkey-proto"
description = "Nodkey agent protocol v1: messages, HPKE sealing, signed relay calls, check number"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"
zeroize = "1"
serde.workspace = true
serde_json.workspace = true
