[package]
name = "nodkey"
description = "Ask Nodkey on your iPhone for one-time codes and logins, from the terminal or as an MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nodkey"
path = "src/main.rs"

[dependencies]
nodkey-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
tokio = { version = "1.47", default-features = false, features = ["rt", "macros", "io-std", "io-util", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Terminal echo off while `nodkey secret save` reads a pasted key (secret/noecho.rs). Both are
# already in the dependency tree (tokio, reqwest).
[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

# The agent's private keys in the keychain of the system (keystore.rs): security-framework and
# windows-sys are already in the dependency tree through rustls-platform-verifier.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
nodkey-fake-relay.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "process"] }
