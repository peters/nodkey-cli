[package]
name = "nodkey"
description = "Ask Nodkey on your iPhone for one-time codes and logins, from the terminal or as an MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nodkey"
path = "src/main.rs"

[dependencies]
nodkey-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
tokio = { version = "1.47", default-features = false, features = ["rt", "macros", "io-std", "io-util", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "process"] }
